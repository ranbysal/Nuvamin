<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed (Mock) — Nuvamin</title>
<meta name="description" content="Your mock Nuvamin order is confirmed.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000000'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-size='17' fill='%23FFFFFF'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="">

<header class="site-header"></header>

<section class="page-hero" style="padding-bottom:clamp(60px,8vw,120px)">
  <div class="wrap">
    <div class="result" id="result">
      <div class="r-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5 L10 18 L20 6" stroke="#000" stroke-width="1.8"/></svg>
      </div>
      <p><span class="r-mock">Mock order</span></p>
      <h1 id="r-title">Order confirmed</h1>
      <p class="r-sub" id="r-sub">Thank you &mdash; this is a mock order. No payment was taken and nothing will ship.</p>
      <p class="r-order" id="r-order"></p>
      <div class="result-card" id="r-card" hidden></div>
      <div class="r-actions">
        <a class="btn" href="shop.html">Continue shopping <span class="arr">&rarr;</span></a>
        <a class="btn btn-line" href="faq.html">Read the FAQ</a>
      </div>
      <p class="r-note">Nuvamin is a concept store. This confirmation is a mock &mdash; in the live concept, a receipt and each lot&rsquo;s certificate of analysis would follow by email.</p>
    </div>
  </div>
</section>

<footer class="site-footer"></footer>

<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var id = params.get("order");
    var card = document.getElementById("r-card");
    var orderEl = document.getElementById("r-order");
    var subEl = document.getElementById("r-sub");
    var titleEl = document.getElementById("r-title");

    function usd(n) { return "$" + Number(n).toFixed(2); }
    function esc(v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    var o = null;
    try { o = JSON.parse(sessionStorage.getItem("nuvamin-last-order")); } catch (e) {}

    if (!o || (id && o.id !== id)) {
      titleEl.textContent = "No order found";
      subEl.textContent = "We couldn't find that mock order in this browser session.";
      if (id) orderEl.textContent = "Order " + id + " · Mock";
      return;
    }

    orderEl.textContent = "Order " + o.id + " · Mock";
    var placed = new Date(o.placedAt);
    var a = o.address || {};
    var rows = o.items.map(function (i) {
      return '<div class="rc-row"><span>' + i.quantity + " × " + esc(i.name) + " " + esc(i.mg) +
        (i.code && i.code !== i.name ? ' <small style="color:var(--ink-40)">' + esc(i.code) + "</small>" : "") +
        "</span><span>" + usd(i.lineTotal) + "</span></div>";
    }).join("");
    card.innerHTML =
      '<p class="rc-head">Ship to</p>' +
      '<p class="rc-addr">' + esc(o.customer && o.customer.name) + "<br>" + esc(a.line1) + (a.line2 ? "<br>" + esc(a.line2) : "") +
      "<br>" + esc(a.postal) + " " + esc(a.city) + "<br>" + esc(a.country) + "</p>" +
      '<p class="rc-head">Items</p>' + rows +
      (o.discount ? '<div class="rc-row"><span>Discount (' + esc(o.discountCode) + ')</span><span>&minus;' + usd(o.discount) + "</span></div>" : "") +
      '<div class="rc-row"><span>Shipping</span><span>' + (o.shipping === 0 ? "Free" : usd(o.shipping)) + "</span></div>" +
      '<div class="rc-row rc-total"><span>Total (mock &mdash; not charged)</span><span>' + usd(o.total) + "</span></div>" +
      '<p class="rc-head" style="margin-top:16px">Placed ' + placed.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" }) +
      " &middot; confirmation for " + esc(o.customer && o.customer.email) + "</p>";
    card.hidden = false;

    try { localStorage.removeItem("nuvamin-cart"); } catch (e) {}
    document.querySelectorAll("[data-cart-count]").forEach(function (el) { el.textContent = "0"; });
  })();
</script>
</body>
</html>
