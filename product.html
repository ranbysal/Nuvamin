<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | Nuvamin</title>
<meta name="description" content="Structure, full specification, lot certificate and handling notes for Nuvamin research materials.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nuvamin">
<meta property="og:title" content="Product | Nuvamin">
<meta property="og:description" content="Structure, full specification, lot certificate and handling notes for Nuvamin research materials.">
<meta property="og:image" content="https://nuvamin.bio/assets/img/nvm-204.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000000'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-size='17' fill='%23FFFFFF'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">

<header class="site-header"></header>

<section class="pdp" id="pdp"></section>

<section class="section related">
  <div class="wrap">
    <div class="section-head reveal">
      <div>
        <p class="kicker">From the same family</p>
        <h2 class="h-display h-md">Explore the library</h2>
      </div>
      <a class="section-link" href="shop.html">View all</a>
    </div>
    <div class="pgrid cols-3" id="related-grid"></div>
  </div>
</section>

<footer class="site-footer"></footer>

<script src="assets/js/products.js"></script>
<script src="assets/js/main.js"></script>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var requestedId = params.get("id");
    // No id: default to the flagship material. Unknown id: back to the
    // library rather than a half-broken page.
    var p = requestedId ? nvFindProduct(requestedId) : NV_PRODUCTS[0];
    if (!p) { location.replace("shop.html"); return; }
    var fam = nvFamily(p);
    document.title = p.name + " " + nvQty(p) + " | Nuvamin";

    var qty = 1;
    function spec(k) {
      for (var i = 0; i < p.specs.length; i++) if (p.specs[i].k === k) return p.specs[i].v;
      return "";
    }

    var specRows = p.specs.map(function (s) {
      var v = s.k === "Molecular formula" ? nvFormula(s.v) : s.v;
      return "<tr><td>" + s.k + "</td><td>" + v + "</td></tr>";
    }).join("") +
      "<tr><td>NVM code</td><td>" + p.code + "</td></tr>" +
      "<tr><td>Current lot</td><td>" + p.lot + "</td></tr>";

    var research = p.research.map(function (b) { return "<li>" + b + "</li>"; }).join("");

    var figs = p.components
      ? [["Components", String(p.components.length)], ["Purity", spec("Component purity").replace(/^Each /, "")], ["Format", nvQty(p) + " · 2R vial"], ["Lot", p.lot]]
      : [["Purity", spec("Purity")], ["Molar mass", spec("Molar mass")], ["CAS", spec("CAS")], ["Lot", p.lot]];
    var figHTML = '<dl class="pdp-figs">' + figs.map(function (f) {
      return '<div class="pdp-fig"><dt>' + f[0] + "</dt><dd>" + f[1] + "</dd></div>";
    }).join("") + "</dl>";

    var structCap = p.components
      ? "<span>" + p.components.length + "-component panel</span><span>" + spec("Composition").split(",")[1] + "</span>"
      : "<span>" + nvFormula(spec("Molecular formula")) + "</span><span>" + spec("Molar mass") + "</span>";

    var components = p.components
      ? '<div class="acc-item"><button class="acc-btn" aria-expanded="false">Panel composition <span class="acc-x">+</span></button><div class="acc-panel"><div class="acc-body"><ul class="pdp-components">' +
        p.components.map(function (c) { return "<li>" + c + "</li>"; }).join("") +
        "</ul><p style=\"margin-top:12px\">" + spec("Composition") + ". Components are weighed individually on a calibrated microbalance and co-packaged in a single vial.</p></div></div></div>"
      : "";

    var cold = /−20/.test(spec("Storage"));

    document.getElementById("pdp").innerHTML =
      '<div class="pdp-media-col" style="background:' + p.panel + '"><div class="pdp-media">' + nvProductImg(p) + "</div></div>" +
      '<div class="pdp-info">' +
      '<p class="pdp-cat"><i class="fam-dot" style="background:' + fam.color + ';margin-right:10px;vertical-align:1px"></i>' + p.code + " &middot; " + fam.long + "</p>" +
      '<h1 class="h-display pdp-title">' + p.name + "</h1>" +
      '<p class="pdp-sub">' + p.sub + "</p>" +
      '<p class="pdp-price">$' + p.price.toFixed(2) + '</p>' +
      '<p class="pdp-form">' + nvQty(p) + " &middot; " + p.form + " &middot; " + p.grade + "</p>" +
      '<p class="pdp-blurb">' + p.blurb + "</p>" +
      figHTML +
      '<p class="pdp-context">Applications</p>' +
      '<ul class="pdp-research">' + research + "</ul>" +
      '<div class="pdp-buy">' +
      '<div class="qty"><button type="button" data-q="-1" aria-label="Decrease quantity">&minus;</button><output id="qty-out">1</output><button type="button" data-q="1" aria-label="Increase quantity">+</button></div>' +
      '<button class="btn" id="pdp-add">Add to cart &middot; $<span id="pdp-total">' + p.price.toFixed(2) + "</span></button>" +
      "</div>" +
      '<p class="pdp-ship"><span>Free shipping over $150</span><span>' + (cold ? "Cold-pack dispatch" : "Ambient dispatch") + '</span><span>Certificate included</span><span>Lot ' + p.lot + "</span></p>" +
      '<p class="pdp-ruo">For research use only. Not for use in diagnostic or therapeutic procedures.</p>' +
      '<figure class="pdp-struct"><img src="assets/img/structures/' + p.id + '.svg" alt="Chemical structure of ' + p.name + '" loading="lazy">' +
      "<figcaption>" + structCap + "</figcaption></figure>" +
      '<div class="acc">' +
      '<div class="acc-item"><button class="acc-btn" aria-expanded="false">Analytical specification <span class="acc-x">+</span></button><div class="acc-panel"><div class="acc-body"><table>' + specRows + "</table></div></div></div>" +
      components +
      '<div class="acc-item"><button class="acc-btn" aria-expanded="false">Certificate of analysis <span class="acc-x">+</span></button><div class="acc-panel"><div class="acc-body"><p>Lot ' + p.lot + " of " + p.name + " was released after we confirmed identity by <sup>1</sup>H-NMR and LC-MS, purity by " + (/CAD/.test(spec("Purity")) ? "HPLC with charged-aerosol detection" : "HPLC-UV") + " and water content by Karl Fischer titration. A printed copy comes in the box, and we keep the full record on file for five years.</p>" +
      '<p style="margin-top:14px"><a class="inline-link" href="coa.html?id=' + p.id + '">View the certificate for lot ' + p.lot + " &rarr;</a></p></div></div></div>" +
      '<div class="acc-item"><button class="acc-btn" aria-expanded="false">Handling &amp; storage <span class="acc-x">+</span></button><div class="acc-panel"><div class="acc-body"><p>Store the sealed vial at ' + spec("Storage") + ". " + (cold ? "Allow the vial to reach room temperature before opening to avoid condensation on the material. " : "") + "Solubility: " + spec("Solubility").charAt(0).toLowerCase() + spec("Solubility").slice(1) + ". We recommend preparing solutions fresh. Concentrations and buffers will depend on your method.</p></div></div></div>" +
      '<div class="acc-item"><button class="acc-btn" aria-expanded="false">Shipping <span class="acc-x">+</span></button><div class="acc-panel"><div class="acc-body"><p>Prepared for dispatch within one to two business days. ' + (cold ? "This material ships on cold packs in an insulated shipper." : "This material is stable at ambient temperature and ships in standard protective packaging.") + " Tracked shipping to the US, Canada, the UK and the EU. See <a class=\"inline-link\" href=\"shipping-returns.html\">Shipping &amp; Returns</a> for details.</p></div></div></div>" +
      "</div></div>";

    function syncQty() {
      document.getElementById("qty-out").textContent = qty;
      document.getElementById("pdp-total").textContent = (p.price * qty).toFixed(2);
    }
    document.querySelectorAll("[data-q]").forEach(function (b) {
      b.addEventListener("click", function () {
        qty = Math.max(1, qty + parseInt(b.getAttribute("data-q"), 10));
        syncQty();
      });
    });
    document.getElementById("pdp-add").addEventListener("click", function () {
      nvCart.add(p.id, qty);
    });

    var related = NV_PRODUCTS.filter(function (x) { return x.id !== p.id; })
      .sort(function (a, b) {
        return (b.family === p.family) - (a.family === p.family);
      })
      .slice(0, 3);
    document.getElementById("related-grid").innerHTML =
      related.map(function (x, i) { return nvProductCard(x, i); }).join("");
    nvWatchReveals();
  })();
</script>
</body>
</html>
